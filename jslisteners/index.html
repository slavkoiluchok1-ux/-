<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket</title>
    <style>
      #launch {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }
      #launch:hover {
        background-color: #34495e;
      }
    </style>
  </head>
  <body>
    <h1>ЗАПУСК РАКЕТИ</h1>
    <p>Натисни кнопку щоб запустити ракету</p>
    <button id="launch">ЗАПУСК</button>

    <script src="script.js"></script>
  </body>
</html>
