<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <title>Оформлення замовлення</title>
  </head>
  <body>
    <div class="wrapper order-container">
      <div class="product-center">
        <img
          src="{{ url_for('static', filename='images/' + product.image_filename) }}"
          alt="{{ product.name }}"
        />
        <h2>{{ product.name }}</h2>
        <p class="desc">{{ product.description }}</p>
        <div class="price">{{ product.price }} ₴</div>
      </div>

      <div class="form-section">
        <p class="form-title">Введіть ваші контактні дані</p>

        <form action="/order/{{ product.id }}" method="POST">
          <div class="form-group">
            <label>НОМЕР ТЕЛЕФОНУ</label>
            <input
              type="text"
              name="phone"
              placeholder="+380 XX XXX XX XX"
              required
            />
          </div>

          <div class="form-group">
            <label>ЕЛЕКТРОННА ПОШТА</label>
            <input
              type="email"
              name="email"
              placeholder="example@gmail.com"
              required
            />
          </div>

          <button type="submit" class="btn-green">ПІДТВЕРДИТИ</button>
        </form>
      </div>
    </div>
  </body>
</html>
