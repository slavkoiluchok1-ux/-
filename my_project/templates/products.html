<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <title>Каталог товарів</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        {% for product in products %}
        <div class="card">
          <img
            src="{{ url_for('static', filename='images/' + product.image_filename) }}"
            alt="{{ product.name }}"
          />
          <div class="card-info">
            <h3>{{ product.name }}</h3>
            <p>{{ product.description }}</p>
            <div class="price">{{ product.price }} ₴</div>
            <a href="/order/{{ product.id }}" class="btn">КУПИТИ</a>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
