<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Бронювання | Neon Noodle</title>
    <style>
      body {
        background-color: #0d0d0d;
        color: #fff;
        font-family: "Segoe UI", sans-serif;
        margin: 0;
      }
      .res-box {
        max-width: 500px;
        margin: 50px auto;
        padding: 30px;
        border: 1px solid #f0f;
        background: #111;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(240, 0, 240, 0.3);
      }
      h2 {
        color: #0ff;
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 25px;
      }
      label {
        display: block;
        margin-top: 15px;
        color: #888;
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        background: #222;
        border: 1px solid #0ff;
        color: #fff;
        border-radius: 5px;
        box-sizing: border-box;
      }
      .btn-res {
        width: 100%;
        margin-top: 25px;
        padding: 15px;
        background: #f0f;
        color: #fff;
        border: none;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-res:hover {
        background: #fff;
        color: #f0f;
        box-shadow: 0 0 20px #fff;
      }
      .flash-msg {
        text-align: center;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
        font-weight: bold;
      }
      .msg-danger {
        color: #ff0055;
        background: rgba(255, 0, 85, 0.1);
      }
    </style>
  </head>
  <body>
    {% include '_navigation.html' %}

    <div class="res-box">
      <h2>Забронювати столик</h2>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="flash-msg msg-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <form method="POST">
        <input
          type="hidden"
          name="csrf_token"
          value="{{ session.csrf_token }}"
        />

        <label>Дата та час:</label>
        <input type="datetime-local" name="time" required />

        <label>Тип столика:</label>
        <select name="table_type">
          <option value="Біля вікна">Біля вікна (Панорама)</option>
          <option value="Основний зал">Основний зал</option>
          <option value="VIP кімната">VIP кімната (Приватна)</option>
          <option value="Барна стійка">Барна стійка</option>
        </select>

        <button type="submit" class="btn-res">ПІДТВЕРДИТИ БРОНЬ</button>
      </form>
    </div>
  </body>
</html>
