<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Месенджер{% endblock %}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --success: #10b981;
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border: #e5e7eb;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        padding: 20px;
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 600px;
        background: var(--card-bg);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        margin-top: 20px;
      }

      h1,
      h2,
      h3 {
        color: var(--text-main);
        text-align: center;
        margin-top: 0;
      }

      /* Навігація */
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      nav a {
        text-decoration: none;
        padding: 8px 16px;
        background: #eef2ff;
        color: var(--primary);
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
      }

      nav a:hover {
        background: var(--primary);
        color: white;
      }

      nav a.logout {
        background: #fef2f2;
        color: var(--danger);
      }
      nav a.logout:hover {
        background: var(--danger);
        color: white;
      }

      /* Кнопки */
      .btn {
        display: block;
        width: 100%;
        padding: 12px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        font-size: 16px;
        font-weight: 500;
        transition: 0.2s;
        text-decoration: none;
        box-sizing: border-box;
      }

      .btn:hover {
        background-color: var(--primary-hover);
      }
      .btn-danger {
        background-color: var(--danger);
      }
      .btn-danger:hover {
        background-color: var(--danger-hover);
      }
      .btn-success {
        background-color: var(--success);
      }
      .btn-small {
        width: auto;
        display: inline-block;
        padding: 8px 16px;
        font-size: 14px;
      }

      /* Форми */
      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 15px;
        transition: border-color 0.2s;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
      }

      /* Flash повідомлення */
      .flash {
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
      }
      .flash.danger {
        background-color: #fef2f2;
        color: #991b1b;
        border: 1px solid #f87171;
      }
      .flash.success {
        background-color: #ecfdf5;
        color: #065f46;
        border: 1px solid #34d399;
      }
      .flash.info {
        background-color: #eff6ff;
        color: #1e40af;
        border: 1px solid #60a5fa;
      }
      .flash.warning {
        background-color: #fffbeb;
        color: #92400e;
        border: 1px solid #fbbf24;
      }

      /* Списки та картки */
      .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background: #f9fafb;
        border-radius: 8px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
      }

      .message-card {
        background: #f3f4f6;
        padding: 15px;
        border-radius: 12px;
        border-bottom-left-radius: 2px;
        margin-bottom: 15px;
        position: relative;
      }
      .message-card strong {
        color: var(--primary);
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }

      .text-center {
        text-align: center;
      }
      .mt-3 {
        margin-top: 15px;
      }
      .text-muted {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
      }
      .text-muted:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %} {% block content %}{% endblock %}
    </div>
  </body>
</html>
