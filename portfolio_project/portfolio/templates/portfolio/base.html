<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Портфоліо{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7ff;
      --surface: #ffffff;
      --text: #14213d;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #0f172a;
      --border: rgba(15, 23, 42, 0.08);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 24%),
        radial-gradient(circle at right center, rgba(56, 189, 248, 0.12), transparent 30%),
        linear-gradient(135deg, #f8fbff 0%, #eef5ff 60%, #f8fbff 100%);
      min-height: 100vh;
    }

    .navbar {
      background: rgba(8, 15, 37, 0.92) !important;
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 1030;
      box-shadow: 0 10px 30px rgba(2, 8, 23, 0.16);
    }

    .navbar-brand, .nav-link { font-weight: 600; }
    .nav-link { color: #e2e8f0 !important; }
    .nav-link:hover { color: #ffffff !important; }

    .nav-pill {
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      margin: 0.15rem 0.2rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .nav-pill:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }

    .navbar-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .nav-item {
      margin: 0;
    }

    .nav-link {
      white-space: nowrap;
      padding: 0.55rem 0.95rem;
      font-size: 0.95rem;
    }

    @media (max-width: 991px) {
      .navbar-nav {
        display: block;
      }
      .nav-item {
        margin-bottom: 0.3rem;
      }
    }

    .hero-panel {
      background: linear-gradient(135deg, #0f172a 0%, #2563eb 45%, #38bdf8 100%);
      color: #ffffff;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 22px 60px rgba(37, 99, 235, 0.24);
      position: relative;
      overflow: hidden;
    }

    .hero-panel::before {
      content: '';
      position: absolute;
      inset: -20% 60% auto auto;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      filter: blur(4px);
    }

    .hero-panel .btn {
      border-radius: 999px;
      padding: 0.8rem 1.15rem;
      font-weight: 600;
    }

    .card-soft {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 1.5rem;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card-soft:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .text-muted-soft { color: var(--muted); }

    .progress { height: 12px; border-radius: 999px; background: #e2e8f0; }
    .progress-bar { background: linear-gradient(90deg, var(--primary), #38bdf8); }

    .img-cover {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 1rem 1rem 0 0;
    }

    .form-control, .form-select, textarea {
      border-radius: 0.9rem;
      border: 1px solid #cbd5e1;
      padding: 0.8rem 1rem;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
    }

    .footer {
      background: var(--primary-dark);
      color: #e2e8f0;
      margin-top: 3rem;
    }

    @media (max-width: 767px) {
      .hero-panel { padding: 1.5rem; }
      .navbar-brand { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand me-3 fw-bold" href="{% url 'portfolio:home' %}">Портфоліо</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto flex-wrap align-items-center">
        <li class="nav-item"><a class="nav-link nav-pill" href="{% url 'portfolio:home' %}">Головна</a></li>
        <li class="nav-item"><a class="nav-link nav-pill" href="{% url 'portfolio:projects' %}">Проєкти</a></li>
        <li class="nav-item"><a class="nav-link nav-pill" href="{% url 'portfolio:skills' %}">Навички</a></li>
        <li class="nav-item"><a class="nav-link nav-pill" href="{% url 'portfolio:contacts' %}">Контакти</a></li>
        <li class="nav-item"><a class="nav-link nav-pill" href="{% url 'portfolio:pricing' %}">Прайс</a></li>
        <li class="nav-item"><a class="nav-link nav-pill" href="{% url 'portfolio:blog' %}">Блог</a></li>
        <li class="nav-item"><a class="nav-link nav-pill" href="{% url 'portfolio:analytics' %}">Аналітика</a></li>
        <li class="nav-item"><a class="nav-link nav-pill" href="{% url 'portfolio:order_brif' %}">Бриф</a></li>
        <li class="nav-item"><a class="nav-link nav-pill" href="/admin/">Адмін</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-2 py-md-4">
  {% block content %}{% endblock %}
</main>
<footer class="footer py-4">
  <div class="container text-center">
    <p class="mb-0">Портфоліо Django українською. Створено як навчальний проект.</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
