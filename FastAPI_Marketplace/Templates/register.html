{% extends "base.html" %}

{% block title %}Fast Money | Реєстрація{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Реєстрація</h1>
    <p class="subtitle">Створіть обліковий запис у Fast Money</p>

    <form id="registerForm">
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}" />
        {% endif %}
        <div class="form-group">
            <label for="username">Ім'я користувача</label>
            <input id="username" name="username" type="text" placeholder="Введіть username" required />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Введіть email" required />
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" placeholder="Введіть пароль" required />
        </div>

        <button type="submit">Зареєструватися</button>
        <div id="message" class="message" aria-live="polite"></div>
    </form>

    <div class="link-row">
        Вже маєте акаунт? <a href="/login">Увійти</a>
    </div>
</div>

<script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');

    function getNextParam() {
        const hidden = document.querySelector('input[name="next"]');
        if (hidden && hidden.value) return hidden.value;
        const params = new URLSearchParams(window.location.search);
        return params.get('next') || '';
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        message.textContent = '';
        message.className = 'message';

        const nextParam = getNextParam();

        const payload = {
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            next: nextParam
        };

        if (!payload.username || !payload.email || !payload.password) {
            showMessage('Будь ласка, заповніть всі поля.', 'error');
            return;
        }

        try {
            const response = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const contentType = response.headers.get('content-type');
            let data = {};

            if (contentType && contentType.includes('application/json')) {
                data = await response.json();
            } else {
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }
                showMessage('Помилка сервера. Спробуйте пізніше.', 'error');
                return;
            }

            if (response.status === 503) {
                showMessage('База даних недоступна. Переконайтеся, що PostgreSQL запущено.', 'error');
                return;
            }

            if (!response.ok) {
                const errorMessage = Array.isArray(data.detail)
                    ? data.detail.map(item => item.msg || item).join(', ')
                    : (data.detail || 'Помилка реєстрації');
                showMessage(errorMessage, 'error');
                return;
            }

            if (data.access_token) {
                localStorage.setItem('token', data.access_token);
            }

            showMessage(data.message || 'Реєстрація успішна! Входимо в акаунт...', 'success');
            const isAdmin = !!data.is_admin || !!data.is_superuser;
            const target = (!isAdmin && nextParam) ? nextParam : (data.redirect_url || '/');
            setTimeout(() => window.location.href = target, 1500);
        } catch (error) {
            showMessage(error.message || 'Помилка реєстрації', 'error');
        }
    });

    function showMessage(text, type) {
        message.textContent = text;
        message.classList.add(type);
    }
</script>
{% endblock %}
