{% extends "base.html" %}

{% block title %}Fast Money | Реєстрація{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Реєстрація</h1>
    <p class="subtitle">Створіть обліковий запис у Fast Money</p>

    <form id="registerForm">
        <div class="form-group">
            <label for="first_name">Ім'я</label>
            <input id="first_name" name="first_name" type="text" placeholder="Введіть ім'я" />
        </div>

        <div class="form-group">
            <label for="last_name">Прізвище</label>
            <input id="last_name" name="last_name" type="text" placeholder="Введіть прізвище" />
        </div>

        <div class="form-group">
            <label for="username">Ім'я користувача</label>
            <input id="username" name="username" type="text" placeholder="Введіть username" required />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Введіть email" required />
        </div>

        <div class="form-group">
            <label for="birth_date">Дата народження</label>
            <input id="birth_date" name="birth_date" type="date" required />
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" placeholder="Введіть пароль" required />
        </div>

        <button type="submit">Зареєструватися</button>
        <div id="message" class="message" aria-live="polite"></div>
    </form>

    <div class="link-row">
        Вже маєте акаунт? <a href="/login">Увійти</a>
    </div>
</div>

<script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        message.textContent = '';
        message.className = 'message';

        const payload = {
            first_name: document.getElementById('first_name').value.trim() || null,
            last_name: document.getElementById('last_name').value.trim() || null,
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            birth_date: document.getElementById('birth_date').value || null,
            password: document.getElementById('password').value
        };

        if (!payload.username || !payload.email || !payload.password || !payload.birth_date) {
            showMessage('Будь ласка, заповніть всі обов’язкові поля.', 'error');
            return;
        }

        const birthDate = new Date(payload.birth_date + 'T00:00:00');
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDiff = today.getMonth() - birthDate.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
            age--;
        }
        if (age < 18) {
            showMessage('Реєстрацію дозволено лише особам від 18 років.', 'error');
            return;
        }

        try {
            const response = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const contentType = response.headers.get('content-type');
            let data = {};

            if (contentType && contentType.includes('application/json')) {
                data = await response.json();
            } else {
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }
                showMessage('Помилка сервера. Спробуйте пізніше.', 'error');
                return;
            }

            if (response.status === 503) {
                showMessage('База даних недоступна. Переконайтеся, що PostgreSQL запущено.', 'error');
                return;
            }

            if (!response.ok) {
                const errorMessage = Array.isArray(data.detail)
                    ? data.detail.map(item => item.msg || item).join(', ')
                    : (data.detail || 'Помилка реєстрації');
                showMessage(errorMessage, 'error');
                return;
            }

            if (data.access_token) {
                localStorage.setItem('token', data.access_token);
            }

            showMessage(data.message || 'Реєстрація успішна! Входимо в акаунт...', 'success');
            setTimeout(() => window.location.href = data.redirect_url || '/', 1500);
        } catch (error) {
            showMessage(error.message || 'Помилка реєстрації', 'error');
        }
    });

    function showMessage(text, type) {
        message.textContent = text;
        message.classList.add(type);
    }
</script>
{% endblock %}
